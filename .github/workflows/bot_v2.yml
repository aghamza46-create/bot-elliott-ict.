name: Bot V2 Elliott + ICT
 
on:
  schedule:
    # toutes les 15 min, du lundi au vendredi, de 06h00 à 21h45 UTC (Londres -> fin de New York)
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer un message de test Telegram"
        type: boolean
        default: false
 
concurrency:
  group: bot-v2
  cancel-in-progress: false
 
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
 
      - run: pip install -r requirements.txt
 
      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL || vars.CAPITAL || '1000' }}
          LEVERAGE: ${{ secrets.LEVERAGE || vars.LEVERAGE || '100' }}
        run: python signals_bot_v2.py ${{ inputs.force && '--force' || '' }}
